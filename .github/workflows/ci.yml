name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bangzen-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-security:
    name: quality-security (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate Rust lockfile policy
        shell: bash
        run: |
          if [ -f native/rust/Cargo.toml ] && \
             [ ! -f native/rust/Cargo.lock ]; then
            echo "::error::native/rust/Cargo.lock is required."
            exit 1
          fi

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,security]"

      - name: Install cargo-audit
        if: hashFiles('native/rust/Cargo.toml') != ''
        run: cargo install cargo-audit --locked

      - name: Run portable validation gate
        run: python tools/ci.py --profile github

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangzen-ci-report-python-${{ matrix.python-version }}
          path: reports/ci-report.json
          if-no-files-found: warn
          retention-days: 14
